<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport"
		content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	<title>XGo Builder</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: #fff;
			overflow: hidden;
		}

		canvas {
			display: block;
			margin: 0;
			outline: none;
			background-color: #fff;
		}
	</style>
</head>

<body>
	<div id="tabs">
		<div id="tab-loader">
		</div>
		<div id="tab-editor" style="display: none;">
			<canvas id="editor-canvas" tabindex="1"></canvas>
		</div>
		<div id="tab-game" style="display: none;">
			<canvas id="game-canvas" tabindex="2"></canvas>
		</div>
	</div>
	<!--
		脚本按书写顺序执行：先准备 Go WASM 和 Godot Engine，再定义 GameRunner，最后暴露页面 API。
		最近调用方：浏览器 HTML 解析器；最顶层入口：浏览器导航到 runner.html（当前由 index.html 的 iframe 加载）。
	-->
	<script>var miniEngine = null</script>
	<script>var isWasmCompressed = false</script>
	<!-- 定义 new Go()，供 game.js 在普通模式中实例化 ispx.wasm。 -->
	<script src="go.wasm.exec.js"></script>
	<!-- 主线程与 PThread Worker 的消息管理；普通模式也加载，但核心转发逻辑不会启用。 -->
	<script src="worker.message.manager.js"></script>
	<!-- 定义 Godot 的 Engine、Emscripten Module 工厂和 GdspxFuncs 桥接方法。 -->
	<script src="engine.js"></script>
	<!-- 定义 GameRunner，统一编排 Godot WASM、Go WASM、engine.zip 和项目资源。 -->
	<script src="game.js"></script>
	<script src="input-session.js"></script>
	<script src="capture.js"></script>
	<script>
		"use strict";

		let gameRunner = null
		let isShowEditor = false
		const captureBridge = createCaptureBridge(() => window.getScreenshot())

		let lastAssetURLs = null
		let lastConfig = null

		window.spxIsProxyThreadMode = false

		function onProgress(value) {
			const progressEvent = new CustomEvent('onProgress', {
				detail: {
					progress: value
				}
			});
			window.dispatchEvent(progressEvent);
			if (value >= 1) {
				document.getElementById('tab-game').style.display = 'none';
				document.getElementById('tab-editor').style.display = 'none';
				document.getElementById('tab-loader').style.display = 'none';
				let canvas = null
				if (gameRunner.isEditor) {
					if (isShowEditor) {
						document.getElementById('tab-editor').style.display = 'block';
					}
					canvas = document.getElementById('editor-canvas')
				} else {
					document.getElementById('tab-game').style.display = 'block';
					canvas = document.getElementById('game-canvas')
				}
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
			}
		}

		// 最近调用方：GameRunner.onGodotExit()；最顶层来源：Godot main 的 onExit 回调。
		async function handleGodotExit(code) {
            await restartEngineAfterCrash("godot exit", code);
        }

		let restartAttempts = 0;
		let onGameError = null
		let onGameExit = null
		let onEngineCrash = null;
		const MAX_RESTART_ATTEMPTS = 3;
		// 崩溃恢复重建整个底层 Engine；正常 stop/reset 只结束当前游戏局。
		async function restartEngineAfterCrash(reason, code) {
			if (gameRunner != null) {
				gameRunner.onRuntimeReset(code)
			}
			if (restartAttempts >= MAX_RESTART_ATTEMPTS) {
				console.error("Max restart attempts reached.  Please reload manually.");
				if (onEngineCrash != null) {
					onEngineCrash(`Crash detected, Exit code: ${code}`)
				}
				return;
			}
			restartAttempts++;

			console.warn(`Crash detected. Reason: ${reason}, Exit code: ${code}`);
			gameRunner = null;
			try {
				await window.initEngine(lastAssetURLs, lastConfig);
				restartAttempts = 0; 
				console.log("Engine reinitialized.");
			} catch (e) {
				console.error("Engine re-init failed:", e);
			}
		}

		window.onGameError = function (callback) {
			onGameError = callback
		}
		window.onGameExit = function (callback) {
			onGameExit = callback
		}
		window.onEngineCrash = function (callback) {
			onEngineCrash = callback
		}

		window.gdspx_on_runtime_panic = function (msg) {
			if (onGameError != null) {
				onGameError(msg)
			}
		}

		window.gdspx_on_runtime_exit = async (code) => {
			await restartEngineAfterCrash("runtime exit", code);
		}

		window.onGoWasmExit = async (code) => {
			await restartEngineAfterCrash("go wasm exit", code);
		}

		window.gdspx_on_runtime_reset = async (code) => {
			// runtime reset 是正常 StopGame 的完成信号，也会唤醒生命周期 Promise。
			if (gameRunner != null) {
				gameRunner.onRuntimeReset(code)
			}
			if (onGameExit != null) {
				onGameExit(code)
			}
		}

		// 事件注册时机：runner.html 执行内联脚本时；事件来源：Engine.init() 安装的 Module.onAbort。
		window.addEventListener("godot-wasm-crash", async e => {
			await restartEngineAfterCrash("godot crash", e.detail);
		})

		/**
		 * 页面级引擎初始化入口，只启动可复用的 Godot/SPX 底层环境。
		 * 最近调用方：外层 index.js 的 initEngine()，也允许其他宿主直接调用。
		 * 最顶层入口：浏览器 window.load 后的 initializeRuntime()。
		 */
		window.initEngine = async (assetURLs = null, config = {}) => {
			isShowEditor = false
			
			if (gameRunner != null) {
				await gameRunner.ResetGame();
				return;
			}

			if(EnginePackMode == "worker"){
				window.xbuilder_set_ai_description = function (description) {
					gameRunner.callWorkerFunction("xbuilder_set_ai_description", description)
				}
				window.xbuilder_set_ai_interaction_api_endpoint = function (endpoint) {
					gameRunner.callWorkerFunction("xbuilder_set_ai_interaction_api_endpoint", endpoint)
				}
				window.xbuilder_set_ai_interaction_api_token_provider = function (tokenProviderFunction) {
					gameRunner.callWorkerFunction("xbuilder_set_ai_interaction_api_token_provider", tokenProviderFunction)
				}

				window.on_wasm_loaded = function () {}
				window.on_game_started = function () {}
			}
			
			const finalConfig = {
				'projectName': "spx_game",
				'onProgress': onProgress,
				'handleGodotExit': handleGodotExit,
				"gameCanvas": document.getElementById('game-canvas'),
				"logLevel": LOG_LEVEL_NONE,
				"isRuntimeMode": true,
				"assetURLs": {
					"engine.zip": "/engine.zip",
					"game.zip": "/game.zip",
					"ispx.wasm": "/ispx.wasm",
					"engine.wasm": "/engine.wasm",
				},
				"recordingOnGameStart": false,
				"autoDownloadRecordedVideo": false,
			};
			
			if (assetURLs != null) {
				finalConfig.assetURLs = assetURLs
			}

			lastAssetURLs = assetURLs
			lastConfig = config
			Object.assign(finalConfig, config);
			gameRunner = new GameRunner(finalConfig);
			await gameRunner.InitEngine();
		}

		window.initGame = async (files) => {
			// 这里只同步资源并编译脚本；具体 main 由 startGame 触发。
			if (gameRunner == null) throw new Error("Engine is not initialized; call initEngine first")
			await gameRunner.InitGame(files)
		}

		async function captureScreenshot() {
			const gameCanvas = document.getElementById('game-canvas')
			if (!gameCanvas) {
				console.error("gameCanvas not found")
				return null
			}
			if (typeof gameCanvas.toBlob !== 'function') {
				console.error("gameCanvas.toBlob not supported")
				return null
			}
			return new Promise((resolve) => gameCanvas.toBlob(resolve, 'image/png'))
		}

		window.getScreenshot = captureScreenshot
		window.spxSetCaptureHost = (host) => captureBridge.setHost(host)
		window.spxGetCaptureHost = () => captureBridge.getHost()
		window.spxFlushCaptureQueue = () => captureBridge.flush()
		window.__spxHandleCaptureRequest = (request) => {
			if (typeof window.getScreenshot !== 'function') {
				return { error: 'spx: getScreenshot is not configured' }
			}
			return captureBridge.handleRequest(request)
		}

		window.startGame = async (options = {}) => {
			// 门面先补齐输入会话默认值，再由 GameRunner 做严格校验和生命周期串行化。
			if (gameRunner == null) throw new Error("Engine is not initialized; call initEngine first")
			await gameRunner.StartGame(spxInputSession.normalizeStartOptions(options));
		}

		window.getInputSessionStatus = async () => {
			if (gameRunner == null) return { mode: 'idle', completed: false, currentTick: null, nextFrame: 0, frameCount: 0 }
			return gameRunner.getInputSessionStatus()
		}

		window.waitInputSessionCompleted = async (options = {}) => {
			if (gameRunner == null) throw new Error("Engine is not initialized; call initEngine first")
			const status = await gameRunner.waitInputSessionCompleted(options)
			await captureBridge.flush()
			return status
		}

		window.stopGame = async () => {
			if (gameRunner == null) {
				throw new Error("Engine is not initialized; call initEngine first")
			}
			// 在 runtime 退出前排空截图请求，确保回放最后一帧的捕获已经交付。
			const result = await gameRunner.StopGame(() => captureBridge.flush());
			await captureBridge.flush()
			return {
				...result,
				inputReplay: spxInputSession.replayBlob(result.inputReplay),
			}
		}

		window.startRecording = () => {
			if (gameRunner == null) {
				console.error("Engine is not initialized; call initEngine first")
				return
			}
			gameRunner.startRecording()
		}

		window.stopRecording = async () => {
			if (gameRunner == null) {
				console.error("Engine is not initialized; call initEngine first")
				return
			}
			return gameRunner.stopRecording()
		}

		window.getRecordedVideo = () => {
			if (gameRunner == null) {
				console.error("Engine is not initialized; call initEngine first")
				return null
			}
			return gameRunner.getRecordedVideo()
		}

		window.downloadRecordedVideo = (filename) => {
			if (gameRunner == null) {
				console.error("Engine is not initialized; call initEngine first")
				return null
			}
			gameRunner.downloadRecordedVideo(filename)
		}

		window.pauseGame = () => {
			if (gameRunner == null) {
				console.error("Engine is not initialized; call initEngine first")
				return
			}
			gameRunner.pause();
		}

		window.isGamePaused = () => {
			return gameRunner != null && gameRunner.isPaused();
		}

		window.resumeGame = () => {
			if (gameRunner == null) {
				console.error("Engine is not initialized; call initEngine first")
				return
			}
			gameRunner.resume();
		}

		window.stepNextFrame = () => {
			if (gameRunner == null) {
				console.error("Engine is not initialized; call initEngine first")
				return
			}
			gameRunner.stepNextFrame();
		}
		
		// 通知父页面：window 上的运行器 API 已全部安装完成。
		window.dispatchEvent(new Event('runnerReady'));
	</script>
</body>

</html>
